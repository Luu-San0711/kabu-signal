# 株シグナル クラウド自動実行（GitHub Actions・外部サービス不要）
# 日曜夜: 今週の指示（月曜の寄付で発注）/ 平日夕方: 手仕舞い判定 / 土曜: まとめ
# GitHubの予約実行は数時間遅れたり抜けたりするため、同じ処理を複数の時刻に予約し、
# 2回目以降は「済み」としてスキップする（jobs.py auto）。時刻は混雑する毎時0〜5分を避けている。
# Issue が作られた時: アプリからの記録（発注した・見送った・現金の設定）を反映
name: kabu-signal

on:
  schedule:
    - cron: '17 11 * * 0'     # 日 20:17 JST  今週の指示
    - cron: '47 13 * * 0'     # 日 22:47 JST  （予備）
    - cron: '23 20 * * 0'     # 月 05:23 JST  （予備）
    - cron: '41 22 * * 0'     # 月 07:41 JST  （予備）
    - cron: '37 7 * * 1-5'    # 平日 16:37 JST 手仕舞い判定
    - cron: '13 11 * * 1-5'   # 平日 20:13 JST （予備・当日データが遅れた時用）
    - cron: '19 1 * * 6'      # 土 10:19 JST  まとめ
    - cron: '53 3 * * 6'      # 土 12:53 JST  （予備）
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: '手動実行する処理'
        type: choice
        default: dashboard
        options: [monday, evening, saturday, dashboard]

permissions:
  contents: write
  issues: write

concurrency:
  group: kabu-signal
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

jobs:
  run:
    # Issue 起動は「リポジトリの持ち主が作った Issue」だけ処理する
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: ライブラリ導入
        run: pip install -r requirements.txt

      - name: 価格データのキャッシュ復元
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kabu-data-${{ github.run_id }}
          restore-keys: kabu-data-

      - name: 価格データの確保（キャッシュ→バックアップ→新規取得の順）
        run: python tool/cloud_sync.py ensure-data

      - name: ジョブ実行
        id: job
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ "${{ github.event_name }}" = "issues" ]; then
            JOB=record
          elif [ -z "$JOB" ]; then
            JOB=auto
          fi
          echo "JOB=$JOB"
          python tool/jobs.py "$JOB"

      - name: 記録の結果を Issue に返して閉じる
        if: github.event_name == 'issues'
        run: |
          MSG="$(cat tool/state/record_result.txt 2>/dev/null || echo '処理しました')"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG" || true
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} || true

      - name: 実行ログを保存（失敗時の原因確認用）
        if: always()
        run: |
          mkdir -p tool/state
          { echo "=== run $(date '+%Y-%m-%d %H:%M') ==="; cat data/fetch.log 2>/dev/null | tail -n 200; cat tool/state/tool.log 2>/dev/null | tail -n 200; } > tool/state/last_run.log || true
          : > data/fetch.log 2>/dev/null || true   # 前回までの取得ログを持ち越さない

      - name: 失敗をLINEで知らせる
        if: failure()
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then exit 0; fi
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"株シグナル: クラウド実行が失敗しました。\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" || true

      - name: 価格データのキャッシュ保存
        if: always() && hashFiles('data/*.parquet') != '' && github.event_name != 'issues'
        uses: actions/cache/save@v4
        with:
          path: data
          key: kabu-data-${{ github.run_id }}

      - name: 価格データのバックアップ（GitHub Release）
        if: always() && github.event_name != 'issues'
        run: python tool/cloud_sync.py backup

      - name: 状態とダッシュボードを保存（git commit）
        if: always()
        run: |
          git config user.name "kabu-signal-bot"
          git config user.email "kabu-signal-bot@users.noreply.github.com"
          git add -A tool/state 2>/dev/null || true
          git add data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動実行: $(date '+%Y-%m-%d %H:%M') 状態更新"
            git pull --rebase origin main || true
            git push
          fi
