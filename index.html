<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFBFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>株シグナル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#FBFBFA;--card:#FFFFFF;--ink:#17181C;--muted:#6F7278;--faint:#A9ABB0;--line:#ECECEA;--line2:#E1E1DE;--up:#1A9D5C;--down:#D6433B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.num{font-family:"Inter","Noto Sans JP",sans-serif}
.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wrap{max-width:520px;margin:0 auto;padding:0 24px}
.head{padding:22px 0 0}
.head .sub{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.head h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.head h1 span{color:var(--muted);font-weight:700;font-size:20px}
.list{margin-top:14px}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row .top{display:flex;align-items:center;gap:10px}
.tag{flex:none;width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tag.sell{background:var(--down)}.tag.done{background:var(--up)}.tag.skip{background:var(--faint)}
.row .ttl{flex:1;font-size:18px;font-weight:800;letter-spacing:-.01em}
.row .ttl small{font-size:14px;font-weight:600;color:var(--muted)}
.row .st{flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.row .st.on{color:var(--ink)}
.row .desc{font-size:13px;color:var(--muted);margin:6px 0 0 36px}
.row.tap{cursor:pointer}
.form{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px}
.form label span{font-size:11px;font-weight:600;color:var(--muted)}
.form label.hi span{color:var(--ink)}
.form input{font-family:"Inter",sans-serif;font-size:20px;font-weight:800;color:var(--ink);border:0;border-bottom:1.5px solid var(--line2);background:transparent;padding:4px 0;width:100%;outline:none;border-radius:0}
.form label.hi input{border-bottom:2px solid var(--ink)}
.form input:disabled{color:var(--faint)}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:46px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn[hidden]{display:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:38px;font-size:13px;flex:none;padding:0 16px}
.asset{padding:26px 0 0}
.asset .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.asset .big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.asset .big small{font-size:16px;font-weight:700;color:var(--muted);margin-left:3px}
.asset .chg{font-size:14px;font-weight:700}
.asset .chg span{color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px 0 0}
.stats .k{font-size:11px;font-weight:600;color:var(--muted)}
.stats .v{font-size:16px;font-weight:800}
.up{color:var(--up)}.down{color:var(--down)}
.empty{margin-top:18px;padding:28px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty b{font-size:18px;font-weight:700;margin-top:4px}
.empty .s{font-size:13px;color:var(--muted)}
.sec{font-size:12px;font-weight:600;color:var(--muted);padding:30px 0 8px}
.mini{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mini .d{flex:none;width:40px;font-size:12px;font-weight:600;color:var(--muted)}
.mini .t{flex:1;font-size:14px;font-weight:600}
.mini .t span{color:var(--muted);font-weight:500}
.mini .r{flex:none;font-size:12px;font-weight:600}
.pos .top{display:flex;align-items:center;gap:10px}
.pos .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pos .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pos .n{font-size:17px;font-weight:800;letter-spacing:-.01em}
.pos .n small{font-size:13px;font-weight:600;color:var(--muted)}
.pos .m{font-size:12px;color:var(--muted)}
.pos .v{font-size:17px;font-weight:800}
.pos .p{font-size:13px;font-weight:700}
.chart{margin-top:14px;position:relative;height:120px}
.chart svg{display:block;width:100%;height:120px}
.chart .lab{position:absolute;right:0;font-size:10px;font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.g3 .k{font-size:11px;font-weight:600;color:var(--muted)}.g3 .v{font-size:15px;font-weight:800}
.menu{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.menu .t{flex:1;font-size:15px;font-weight:600}.menu .r{flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set .t{font-size:14px;font-weight:600}.set .s{font-size:11px;color:var(--muted)}
.set .v{flex:none;font-size:18px;font-weight:800}
.set .v small{font-size:12px;color:var(--muted);margin-left:2px}
.set .val{flex:none;display:flex;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:2px}
.set .val input{font-family:"Inter",sans-serif;font-size:18px;font-weight:800;text-align:right;width:96px;border:0;background:transparent;outline:none;padding:0;border-radius:0;color:var(--ink)}
.set .val small{font-size:12px;color:var(--muted);margin-left:2px}
.tog{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;cursor:pointer;display:block}
.tog i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:left .15s}
.tog.on{background:var(--ink)}.tog.on i{left:21px}
.seg{flex:none;display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg span{padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg span.on{background:var(--ink);color:#fff}
.panel{display:none}.panel.on{display:block}
.sub2{display:none;padding-top:8px}.sub2.on{display:block}
.foot{padding:22px 0 0;font-size:11px;color:var(--faint)}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF8E6;color:#7A5A00;font-size:12px;font-weight:500}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom));background:rgba(251,251,250,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding:10px 0 env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--faint);font-size:11px;font-weight:700}
nav a.on{color:var(--ink)}
.back{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-block;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="head"><div class="sub">読み込み中</div><h1>株シグナル</h1></div></div>
<div class="toast" id="toast"></div>
<nav>
  <a href="#today" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 12"/></svg>今日</a>
  <a href="#hold" data-tab="hold"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V10M10 20V6M15 20v-8M20 20V4"/></svg>保有</a>
  <a href="#more" data-tab="more"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>その他</a>
</nav>
<script>
const DATA_URL = "https://raw.githubusercontent.com/Luu-San0711/kabu-signal/main/data.json";
let D = null, open = {}, sub = "";
const yen = n => (Math.round(n)).toLocaleString("ja-JP");
const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const sgn = n => (n >= 0 ? "+" : "−") + yen(Math.abs(n));
const cls = x => x >= 0 ? "up" : "down";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => { if (!s) return "-"; const [y,m,d] = s.split("-"); return `${+m}/${+d}`; };
const wd = s => "日月火水木金土"[new Date(s + "T00:00:00").getDay()];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtPx = (o, v) => o.market === "us" ? "$" + Number(v).toFixed(2) : yen(v);
const isUS = o => o.market === "us";
const isFund = o => o.market === "fund";
const nm = o => isFund(o) ? (o.name || "NASDAQ-100") : isUS(o) ? o.ticker : o.name;

function issueUrl(title, obj) {
  const body = "アプリからの記録です。そのまま「Submit new issue」を押してください。\n\n```\n" + JSON.stringify(obj) + "\n```";
  return `https://github.com/${D.repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
function send(title, obj) {
  const u = issueUrl(title, obj);
  window.open(u, "_blank");
  toast("GitHubで「Submit new issue」を押すと反映されます");
}
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 3200); }

// ---------------------------------------------------------------- 今日
function viewToday() {
  const todo = D.todo || [];
  const pend = todo.filter(o => o.status === "pending");
  const upd = D.updated ? D.updated.slice(5).replace("-", "/") : "";
  let h = `<div class="head"><div class="sub nw">${esc(upd)} 更新 · データ ${esc(md(D.data_date))}</div><h1 class="nw">今日やること <span>${pend.length}</span></h1></div>`;
  if (!todo.length) {
    const nx = (D.next || [])[0];
    h += `<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1A9D5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><b>今日は何もしません</b><div class="s nw">保有はそのまま。次の判断は ${nx ? md(nx.date) + "（" + wd(nx.date) + "）" : "月曜"} 9:05</div></div>`;
  } else {
    h += `<div class="list">` + todo.map(orderRow).join("") + `</div>`;
  }
  h += assetBlock();
  const rec = (D.recent || []).slice(0, 5);
  if (rec.length) {
    h += `<div class="sec">最近の記録</div>` + rec.map(o => `<div class="mini"><span class="d num nw">${md(o.fill_date || o.date)}</span><span class="t nw">${o.side === "buy" ? "買" : "売"} ${esc(nm(o))} ${isFund(o) ? `<span class="num">${yen((o.fill_shares ?? o.shares) * (o.fill_price || o.ref_price))}円</span>` : `${o.fill_shares ?? o.shares}株 ${o.fill_price ? `<span class="num">@${fmtPx(o, o.fill_price)}</span>` : ""}`}</span><span class="r nw ${o.status === "skipped" ? "" : "up"}" style="${o.status === "skipped" ? "color:var(--faint)" : ""}">${o.status === "skipped" ? "見送り" : o.status === "auto" ? "自動記録" : o.status === "expired" ? "期限切れ" : "記録済"}</span></div>`).join("") + `<div style="border-top:1px solid var(--line)"></div>`;
  }
  if (!D.cash_confirmed) h += `<div class="note">現金は推定値です。「その他 → 設定」で実際の購入可能金額に直してください</div>`;
  return h;
}

function orderRow(o) {
  const id = o.id, isOpen = !!open[id];
  const buy = o.side === "buy";
  const name = isFund(o) ? "NASDAQ-100" : isUS(o) ? o.ticker : `${o.code} ${o.name}`;
  let st, tagc = buy ? "" : "sell";
  if (o.status === "pending") st = `<span class="st ${isOpen ? "on" : ""}">未記録 ${isOpen ? "⌄" : "›"}</span>`;
  else if (o.status === "auto") { st = `<span class="st">自動記録</span>`; tagc = "done"; }
  else st = `<span class="st">${o.status === "skipped" ? "見送り" : "記録済"}</span>`;
  const fAmt = o.amount_yen || Math.round(o.ref_price * o.shares);
  const amt = isFund(o) ? `${yen(fAmt)}円` : isUS(o) ? `約$${Math.round(o.ref_price * o.shares).toLocaleString()}` : `約${yen(o.ref_price * o.shares)}円`;
  const desc = o.status === "auto" ? esc(o.note || o.reason)
    : isFund(o) ? `iGrowで15:30までに金額指定${D.nisa ? "（NISA）" : ""}`
    : o.lot ? `単元・寄付成行 · ${amt}${buy && o.stop ? ` · 逆指値 ${yen(o.stop)}円も同時に` : ""}`
    : `かぶミニ寄付（成行） · ${amt}${buy && o.stop ? ` · 損切り ${yen(o.stop)}円（終値で判定）` : ""}${!buy ? ` · ${esc(o.reason)}` : ""}${buy && isUS(o) ? ` · ${esc(o.reason)}` : ""}`;
  let h = `<div class="row ${o.status === "pending" ? "tap" : ""}" data-toggle="${id}"><div class="top"><span class="tag ${tagc}">${o.status === "auto" ? "済" : buy ? "買" : "売"}</span><span class="ttl num nw">${esc(name)} <small>${isFund(o) ? yen(fAmt) + "円" : o.shares + "株"}</small></span>${st}</div><div class="desc nw">${desc}</div>`;
  if (o.status === "pending" && isOpen) {
    const stop = buy && !isUS(o);
    if (isFund(o)) {
      h += `<div class="form"><label class="hi"><span>${buy ? "買った" : "売った"}金額（円）</span><input inputmode="numeric" id="amt-${id}" value="${yen(fAmt)}"></label>
      <label><span>注文日</span><input id="dt-${id}" value="${today()}"></label></div>
      <div class="btns"><button class="btn" data-fill="${id}">記録する</button><button class="btn ghost" data-skip="${id}">見送った</button></div>`;
      return h + `</div>`;
    }
    h += `<div class="form" data-stop="${id}">
      <label><span>株数</span><input inputmode="numeric" id="sh-${id}" value="${o.shares}"></label>
      <label><span>約定日</span><input id="dt-${id}" value="${today()}"></label>
      <label class="hi"><span>約定単価（実際の数字に直す）</span><input inputmode="decimal" id="px-${id}" value="${isUS(o) ? o.ref_price.toFixed(2) : o.ref_price}"></label>
      ${stop ? `<label><span>損切りライン（取得 −10%）</span><input disabled id="st-${id}" value="${yen(o.ref_price * 0.9)}"></label>` : `<label><span>${isUS(o) ? "為替（円/$）" : "備考"}</span><input disabled value="${isUS(o) ? Math.round(o.fx || D.fx) : "-"}"></label>`}
    </div>
    <div class="btns"><button class="btn" data-fill="${id}">記録する</button><button class="btn ghost" data-skip="${id}">見送った</button></div>`;
  }
  return h + `</div>`;
}

function assetBlock() {
  const t = D.total_yen || 0, dd = t - (D.prev_total_yen || t);
  const ytd = D.ytd_yen;
  const nx = (D.next || [])[0];
  const exp = Math.round((D.exposure_pct || 0) * 100);
  return `<div class="asset"><div class="lbl nw">資産（想定）</div><div class="big num nw">${yen(t)}<small>円</small></div>
    <div class="chg num nw ${cls(dd)}">${sgn(dd)}円（${pct(t - dd ? dd / (t - dd) : 0)}） <span>前日比</span>${ytd != null ? ` <span>· 今年 ${sgn(ytd)}円</span>` : ""}</div></div>
    <div class="stats"><div><div class="k nw">現金</div><div class="v num nw">${yen(D.cash_yen)}円</div></div><div><div class="k nw">リスク露出</div><div class="v num nw">${exp}%</div></div><div><div class="k nw">次の予定</div><div class="v num nw">${nx ? md(nx.date) + " " + esc(nx.label) : "-"}</div></div></div>`;
}

// ---------------------------------------------------------------- 保有
function viewHold() {
  const P = D.positions || [];
  const tot = P.reduce((s, x) => s + x.value_yen, 0);
  let h = `<div class="head"><div class="sub nw">${P.length}銘柄 · 評価額 ${yen(tot)}円</div><h1 class="nw">保有</h1></div><div class="list">`;
  if (!P.length) h += `<div class="empty"><b>保有はありません</b><div class="s">月曜の指示を記録すると、ここに並びます</div></div>`;
  h += P.map(posRow).join("") + `</div>`;
  const jp = P.filter(x => x.market === "jp").length;
  h += `<div style="display:flex;align-items:center;gap:10px;padding:18px 0 0"><span class="nw" style="flex:1;font-size:12px;color:var(--muted)">日本株 ${jp} / ${D.max_positions || 5}枠 · 現金 ${yen(D.cash_yen)}円</span><span class="nw" style="flex:none;font-size:12px;font-weight:600;cursor:pointer" data-addpos="1">手で追加 ›</span></div>`;
  return h;
}

function posRow(x) {
  const id = x.id, isOpen = !!open[id];
  const us = x.market === "us" || x.market === "fund", fund = x.market === "fund";
  const name = fund ? "NASDAQ-100" : us ? x.ticker : `${x.code} ${x.name}`;
  const meta = fund ? `楽天・プラス · 露出 ${Math.round((D.us?.exposure ?? 1) * 100)}% · 投資額 ${yen(x.cost_yen)}円`
    : us ? `露出 ${Math.round((D.us?.exposure ?? 1) * 100)}% · 米国コア · 取得 $${x.entry_price.toFixed(2)}`
    : `取得 ${yen(x.entry_price)} · 損切り ${yen(x.stop)} · ${x.sma25 ? "25日線 " + yen(x.sma25) : "保有 " + heldDays(x) + "日"}`;
  let h = `<div class="row pos tap" data-toggle="${id}"><div class="top"><div class="l"><span class="n num nw">${esc(name)} <small>${fund ? "投信" : x.shares + "株"}</small></span><span class="m nw">${meta}</span></div><div class="r"><span class="v num nw">${yen(x.value_yen)}円</span><span class="p num nw ${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</span></div></div>`;
  if (isOpen) {
    h += chart(x);
    const dist = x.stop ? (x.price / x.stop - 1) : null;
    h += `<div class="g3"><div><div class="k nw">${fund ? "評価額（目安）" : "現在値"}</div><div class="v num nw">${fund ? yen(x.value_yen) + "円" : us ? "$" + x.price.toFixed(2) : yen(x.price)}</div></div><div><div class="k nw">${us ? "損益" : "損切りまで"}</div><div class="v num nw ${us ? cls(x.pnl_yen) : ""}">${us ? sgn(x.pnl_yen) + "円" : dist != null ? "−" + (dist * 100).toFixed(1) + "%" : "-"}</div></div><div><div class="k nw">保有日数</div><div class="v num nw">${heldDays(x)}日</div></div></div>`;
    h += `<div class="btns">${fund ? "" : `<button class="btn ghost sm" data-editpos="${id}">株数・単価を直す</button>`}<button class="btn ghost sm" data-delpos="${id}">保有から外す</button></div>`;
  }
  return h + `</div>`;
}
function heldDays(x) { return Math.max(0, Math.round((new Date(today()) - new Date(x.entry_date)) / 86400000)); }

function chart(x) {
  const c = (D.charts || {})[x.ticker];
  if (!c || !c.close || c.close.length < 5) return `<div class="chart" style="height:auto;font-size:12px;color:var(--faint);margin-top:10px">チャートデータなし</div>`;
  const n = 60, close = c.close.slice(-n), sma = (c.sma25 || []).slice(-n);
  const W = 342, H = 120, top = 8, bot = 8;
  const vals = close.filter(v => v != null).concat(x.stop ? [x.stop] : []).concat(sma.filter(v => v != null));
  const lo = Math.min(...vals), hi = Math.max(...vals), rng = (hi - lo) || 1;
  const X = i => (i / (close.length - 1)) * W, Y = v => top + (1 - (v - lo) / rng) * (H - top - bot);
  const path = a => a.map((v, i) => v == null ? "" : `${i === 0 || a[i - 1] == null ? "M" : "L"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  let s = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  if (x.stop && x.stop >= lo) s += `<line x1="0" x2="${W}" y1="${Y(x.stop)}" y2="${Y(x.stop)}" stroke="#D6433B" stroke-dasharray="4 4" stroke-width="1"/>`;
  if (sma.length) s += `<path d="${path(sma)}" fill="none" stroke="#C9CAC6" stroke-width="1" stroke-dasharray="2 4"/>`;
  s += `<path d="${path(close)}" fill="none" stroke="#17181C" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  const last = close[close.length - 1];
  s += `<circle cx="${W}" cy="${Y(last)}" r="3.5" fill="#17181C"/></svg>`;
  if (x.stop && x.stop >= lo) s += `<span class="lab num" style="top:${Y(x.stop) + 2}px;color:#D6433B">損切り ${yen(x.stop)}</span>`;
  s += `<span class="lab num" style="left:0;top:0;color:var(--muted);font-weight:600">${close.length}日</span></div>`;
  return s;
}

// ---------------------------------------------------------------- その他
function viewMore() {
  if (sub) return viewSub();
  const closed = D.closed || [];
  const wins = closed.filter(x => (x.pnl_yen || 0) > 0).length;
  const reg = D.regime || {};
  const u = D.us || {};
  let h = `<div class="head"><div class="sub nw">最終更新 ${esc(D.updated?.slice(5).replace("-", "/") || "")} · 正常</div><h1 class="nw">その他</h1></div><div class="list">`;
  h += `<div class="menu" data-sub="cand"><span class="t nw">候補リスト</span><span class="r nw">監視 ${(D.candidates || []).length} ›</span></div>`;
  h += `<div class="menu" data-sub="perf"><span class="t nw">成績</span><span class="r nw num ${closed.length ? cls(closed.reduce((s, x) => s + (x.pnl_yen || 0), 0)) : ""}">${closed.length ? `決済${closed.length}回 · 勝率${Math.round(wins / closed.length * 100)}% ›` : "まだ決済なし ›"}</span></div>`;
  h += `<div class="menu" data-sub="regime"><span class="t nw">相場の状態</span><span class="r nw">${reg.ok ? "日本株 買いOK" : reg.bull === false ? "日経が200日線割れ" : reg.calm === false ? "急落中" : "-"} · 米国コア露出${Math.round((u.exposure ?? 1) * 100)}% ›</span></div>`;
  h += `<div class="menu" data-sub="log"><span class="t nw">記録の履歴</span><span class="r nw">${(D.events || []).length}件 ›</span></div></div>`;
  h += `<div class="sec">設定</div>`;
  h += `<div class="set" style="border-top:1px solid var(--line)"><div class="l"><span class="t nw">購入可能金額</span><span class="s nw">${D.cash_confirmed ? "記録すると自動で増減。ズレたらここで直す" : "推定値です。実際の金額に直してください"}</span></div><span class="val"><input inputmode="numeric" id="cash-in" value="${yen(D.cash_yen)}" data-orig="${D.cash_yen}"><small>円</small></span><button class="btn sm save" data-cash="1" hidden>保存</button></div>`;
  h += `<div class="set"><div class="l"><span class="t nw">毎月の積み増し</span><span class="s nw">毎月1日に自動で加算</span></div><span class="val"><input inputmode="numeric" id="add-in" value="${yen(D.monthly_add_yen)}" data-orig="${D.monthly_add_yen}"><small>円</small></span><button class="btn sm save" data-add="1" hidden>保存</button></div>`;
  h += `<div class="set"><div class="l"><span class="t nw">配分（米国：日本）</span><span class="s nw">四半期ごとに戻す</span></div><div class="seg"><span class="${D.alloc_us == 0.5 ? "on" : ""}" data-alloc="0.5">50 : 50</span><span class="${D.alloc_us == 0.67 ? "on" : ""}" data-alloc="0.67">67 : 33</span></div></div>`;
  h += `<div class="set"><div class="l"><span class="t nw">NISA口座</span><span class="s nw">使う場合は米国ETFをNISA成長枠で</span></div><span class="tog ${D.nisa ? "on" : ""}" data-nisa="${D.nisa ? 0 : 1}"><i></i></span></div>`;
  h += `<div class="set" style="border-bottom:1px solid var(--line)"><div class="l"><span class="t nw">LINE通知</span><span class="s nw">月曜 9:05 · 売りが出た平日 19:35 · 土曜まとめ</span></div><span class="tog on"><i></i></span></div>`;
  h += `<div class="foot nw">投資助言ではありません。最終判断はご自身で。</div>`;
  return h;
}

function viewSub() {
  let h = `<div class="head"><span class="back" data-back="1">‹ その他</span>`;
  if (sub === "cand") {
    const C = D.candidates || [];
    h += `<div class="sub nw">55日高値を更新した銘柄 · データ ${md(D.data_date)}</div><h1 class="nw">候補リスト</h1></div><div class="list">`;
    if (!C.length) h += `<div class="empty"><b>候補はありません</b></div>`;
    h += C.map(c => `<div class="mini"><span class="d num nw" style="width:44px">${c.score === 3 ? "★★★" : "★★☆"}</span><span class="t nw">${esc(c.code)} ${esc(c.name)} <span class="num">${yen(c.close)}円</span></span><span class="r num nw" style="color:var(--muted)">${c.turnover_oku.toFixed(1)}億/日</span></div>`).join("");
    h += `<div style="border-top:1px solid var(--line)"></div></div>`;
  } else if (sub === "perf") {
    const closed = (D.closed || []).slice().reverse();
    const tot = closed.reduce((s, x) => s + (x.pnl_yen || 0), 0);
    const H = D.history || [];
    h += `<div class="sub nw">決済済みの取引</div><h1 class="nw">成績</h1></div>`;
    h += `<div class="asset"><div class="lbl nw">決済損益の合計</div><div class="big num nw ${cls(tot)}">${sgn(tot)}<small>円</small></div><div class="chg nw" style="color:var(--muted);font-weight:500">${closed.length}回 · 勝ち ${closed.filter(x => x.pnl_yen > 0).length} · 負け ${closed.filter(x => x.pnl_yen <= 0).length}</div></div>`;
    if (H.length > 1) h += `<div class="sec">資産の推移（毎週土曜）</div>` + H.slice(-12).map(r => `<div class="mini"><span class="d num nw">${md(r.date)}</span><span class="t num nw">${yen(r.total_yen)}円</span><span class="r num nw" style="color:var(--muted)">現金 ${yen(r.cash_yen)}</span></div>`).join("") + `<div style="border-top:1px solid var(--line)"></div>`;
    h += `<div class="sec">決済履歴</div>` + (closed.length ? closed.map(x => `<div class="mini"><span class="d num nw">${md(x.exit_date)}</span><span class="t nw">${esc(nm(x))} ${x.exit_reason ? `<span>${esc(x.exit_reason)}</span>` : ""}</span><span class="r num nw ${cls(x.pnl_yen)}">${sgn(x.pnl_yen)}円</span></div>`).join("") : `<div class="mini"><span class="t" style="color:var(--muted)">まだありません</span></div>`) + `<div style="border-top:1px solid var(--line)"></div>`;
  } else if (sub === "regime") {
    const r = D.regime || {}, u = D.us || {};
    h += `<div class="sub nw">売買ルールが見ている指標</div><h1 class="nw">相場の状態</h1></div>`;
    h += `<div class="sec">日本株（新規買いの条件）</div>`;
    h += `<div class="set" style="border-top:1px solid var(--line)"><div class="l"><span class="t nw">日経平均 ＞ 200日線</span><span class="s num nw">${r.n225 ? `${yen(r.n225)} / ${yen(r.sma200)}` : "-"}</span></div><span class="v nw ${r.bull ? "up" : "down"}" style="font-size:14px">${r.bull ? "OK" : "NG"}</span></div>`;
    h += `<div class="set"><div class="l"><span class="t nw">急落中でない（5日で−3%以内）</span><span class="s nw">急落中は新規買いを止める</span></div><span class="v nw ${r.calm ? "up" : "down"}" style="font-size:14px">${r.calm ? "OK" : "NG"}</span></div>`;
    h += `<div class="sec">米国コア（NASDAQ-100投信・評価はQQQで代用）</div>`;
    h += `<div class="set" style="border-top:1px solid var(--line)"><div class="l"><span class="t nw">直近21日の値動きの大きさ</span><span class="s nw">年率換算（参考。持ちっぱなし運用のため売買はしない）</span></div><span class="v num nw">${u.vol ? Math.round(u.vol * 100) + "%" : "-"}</span></div>`;
    h += `<div class="set" style="border-bottom:1px solid var(--line)"><div class="l"><span class="t nw">現在の露出</span><span class="s nw">四半期ごとに米国・日本を半々に戻す</span></div><span class="v num nw">${Math.round((u.exposure ?? 1) * 100)}%</span></div>`;
  } else if (sub === "log") {
    const E = (D.events || []).slice().reverse();
    h += `<div class="sub nw">システムが記録した出来事</div><h1 class="nw">記録の履歴</h1></div><div class="list">`;
    h += (E.length ? E.map(e => `<div class="mini"><span class="d num nw">${md(e.date)}</span><span class="t nw" style="font-weight:500">${esc(e.text)}</span></div>`).join("") : `<div class="mini"><span class="t" style="color:var(--muted)">まだありません</span></div>`) + `<div style="border-top:1px solid var(--line)"></div></div>`;
  }
  return h;
}

// ---------------------------------------------------------------- 描画・操作
function tab() { const t = (location.hash || "#today").slice(1); return ["today", "hold", "more"].includes(t) ? t : "today"; }
function render() {
  if (!D) return;
  const t = tab();
  document.getElementById("app").innerHTML = t === "today" ? viewToday() : t === "hold" ? viewHold() : viewMore();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
  fitText();
  window.scrollTo(0, 0);
}
function fitText() {
  document.querySelectorAll(".nw").forEach(el => {
    el.style.fontSize = "";
    if (el.scrollWidth <= el.clientWidth + 1) return;
    const base = parseFloat(getComputedStyle(el).fontSize);
    for (let k = 0.95; k >= 0.7; k -= 0.05) {
      el.style.fontSize = (base * k).toFixed(1) + "px";
      if (el.scrollWidth <= el.clientWidth + 1) break;
    }
  });
}
window.addEventListener("resize", fitText);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);
document.addEventListener("input", e => {
  const inp = e.target; if (!inp.dataset || inp.dataset.orig == null) return;
  const btn = inp.closest(".set")?.querySelector(".save"); if (btn) btn.hidden = inp.value.replace(/[^\d]/g, "") === String(inp.dataset.orig);
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-fill],[data-skip],[data-toggle],[data-sub],[data-back],[data-cash],[data-add],[data-alloc],[data-editpos],[data-delpos],[data-addpos],[data-nisa]");
  if (!el) return;
  const d = el.dataset;
  if (d.fill && D.todo.find(x => x.id === d.fill && isFund(x))) {
    const o = D.todo.find(x => x.id === d.fill);
    const amt = +document.getElementById("amt-" + d.fill).value.replace(/[^\d]/g, "");
    const dt = document.getElementById("dt-" + d.fill).value.trim();
    if (!(amt > 0)) return toast("金額を入れてください");
    send(`記録: ${o.side === "buy" ? "買" : "売"} ${nm(o)} ${amt}円`, { action: "fill", order: o.id, shares: amt / o.ref_price, price: o.ref_price, date: dt });
  } else if (d.fill) {
    const o = D.todo.find(x => x.id === d.fill); if (!o) return;
    const sh = +document.getElementById("sh-" + d.fill).value.replace(/[^\d]/g, "");
    const px = +document.getElementById("px-" + d.fill).value.replace(/[^\d.]/g, "");
    const dt = document.getElementById("dt-" + d.fill).value.trim();
    if (!(sh > 0) || !(px > 0)) return toast("株数と約定単価を入れてください");
    send(`記録: ${o.side === "buy" ? "買" : "売"} ${nm(o)} ${sh}株 @${px}`, { action: "fill", order: o.id, shares: sh, price: px, date: dt });
  } else if (d.skip) {
    const o = D.todo.find(x => x.id === d.skip); if (!o) return;
    send(`記録: 見送り ${nm(o)}`, { action: "skip", order: o.id });
  } else if (d.cash) {
    const v = +document.getElementById("cash-in").value.replace(/[^\d]/g, "");
    if (!(v >= 0)) return toast("金額を入れてください");
    send(`設定: 購入可能金額 ${v}円`, { action: "cash", yen: v, note: "手動で設定" });
  } else if (d.add) {
    const v = +document.getElementById("add-in").value.replace(/[^\d]/g, "");
    send(`設定: 毎月の積み増し ${v}円`, { action: "setting", monthly_add_yen: v });
  } else if (d.nisa != null) {
    send(`設定: NISA口座 ${d.nisa == 1 ? "使う" : "使わない"}`, { action: "setting", nisa: d.nisa == 1 });
  } else if (d.alloc) {
    send(`設定: 米国配分 ${Math.round(d.alloc * 100)}%`, { action: "setting", alloc_us: +d.alloc });
  } else if (d.editpos) {
    const x = D.positions.find(p => p.id === d.editpos); if (!x) return;
    const sh = prompt(`${x.name} の株数`, x.shares); if (sh === null) return;
    const px = prompt("取得単価", x.entry_price); if (px === null) return;
    send(`修正: ${x.name} ${sh}株 @${px}`, { action: "position_edit", position: x.id, shares: +sh, price: +px });
  } else if (d.delpos) {
    const x = D.positions.find(p => p.id === d.delpos); if (!x) return;
    if (!confirm(`${x.name} を保有から外しますか？（現金は変わりません）`)) return;
    send(`削除: ${x.name}`, { action: "position_remove", position: x.id });
  } else if (d.addpos) {
    const tk = prompt("銘柄コード（例 7203）"); if (!tk) return;
    const us = /^[A-Z]{2,5}$/.test(tk.trim().toUpperCase());
    const sh = prompt("株数"); if (!sh) return;
    const px = prompt(us ? "取得単価（$）" : "取得単価（円）"); if (!px) return;
    const ticker = us ? tk.trim().toUpperCase() : tk.trim().replace(/\.T$/, "") + ".T";
    send(`追加: ${ticker} ${sh}株 @${px}`, { action: "position_add", market: us ? "us" : "jp", ticker, name: us ? ticker : tk.trim(), shares: +sh, price: +px, fx: D.fx });
  } else if (d.toggle) {
    open[d.toggle] = !open[d.toggle]; render();
  } else if (d.sub) { sub = d.sub; render(); }
  else if (d.back) { sub = ""; render(); }
});
window.addEventListener("hashchange", () => { sub = ""; render(); });
fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => { D = j; render(); })
  .catch(() => { document.getElementById("app").innerHTML = `<div class="head"><div class="sub">データを読み込めませんでした</div><h1>株シグナル</h1></div><div class="empty"><b>しばらくしてから開き直してください</b></div>`; });
</script>
</body>
</html>
